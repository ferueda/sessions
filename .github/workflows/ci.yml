name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Detect documentation-only changes
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed=false
          docs_only=true
          changed_files="${RUNNER_TEMP}/sessions-ci-changed-files"

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null ||
             ! git diff --no-renames --name-only -z "${BASE_SHA}" "${HEAD_SHA}" > "${changed_files}"; then
            docs_only=false
          else
            while IFS= read -r -d '' file; do
              changed=true
              case "${file}" in
                *.md) ;;
                *) docs_only=false ;;
              esac
            done < "${changed_files}"
          fi

          if [[ "${changed}" != "true" ]]; then
            docs_only=false
          fi

          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Skip full checks
        if: needs.changes.outputs.docs_only == 'true' && matrix.os != 'ubuntu-latest'
        run: echo "Documentation-only change; full checks run on Ubuntu only."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v7.0.0

      - name: Setup pnpm
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        run: pnpm install --frozen-lockfile

      - name: Run documentation checks
        if: needs.changes.outputs.docs_only == 'true' && matrix.os == 'ubuntu-latest'
        run: pnpm check:docs

      - name: Run full checks
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm check:ci
