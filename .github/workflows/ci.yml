name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.16.0

      - name: Detect documentation-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/classify-ci-changes.ts

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Skip full checks
        if: needs.changes.outputs.docs_only == 'true' && matrix.os != 'ubuntu-latest'
        run: echo "Documentation-only change; full checks run on Ubuntu only."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: pnpm/action-setup@v6.0.9

      - name: Setup Node.js
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true' || matrix.os == 'ubuntu-latest'
        run: pnpm install --frozen-lockfile

      - name: Run documentation checks
        if: needs.changes.outputs.docs_only == 'true' && matrix.os == 'ubuntu-latest'
        run: pnpm check:docs

      - name: Run full checks
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm check:ci
